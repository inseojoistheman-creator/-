<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="각성록">
<link rel="apple-touch-icon" href="pullup-icon-180.png">
<link rel="manifest" href="pullup.webmanifest">
<title>각성록</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@500;700;900&display=swap">
</head>
<body>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}

@font-face{font-family:"Galmuri11";src:url("https://cdn.jsdelivr.net/npm/galmuri@latest/dist/Galmuri11.woff2") format("woff2");font-display:swap}
:root{
  --bg:#0b0f1e; --panel:#141a33; --panel2:#1c2447; --line:#3b4c8c; --hi:#7fa4ff; --ink:#f4f1e8; --muted:#a9b3d6; --faint:#5e6a99;
  --gold:#ffd23f; --red:#ff4b5c; --green:#4be08a; --cyan:#5fe3ff; --violet:#b07cff; --orange:#ff9f43;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Galmuri11","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55;image-rendering:pixelated;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:16px 16px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 2px,transparent 2px 4px);z-index:50;mix-blend-mode:multiply}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 60px}
.p8{font-family:"Press Start 2P",monospace;letter-spacing:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg{image-rendering:pixelated}

/* pixel window */
.win{position:relative;background:var(--panel);margin-bottom:14px;padding:14px 14px 16px;
  box-shadow:0 0 0 3px var(--line),0 0 0 6px var(--bg),0 0 0 9px #2a3566, 6px 6px 0 9px rgba(0,0,0,.45)}
.win .ttl{display:flex;align-items:center;gap:10px;margin:-14px -14px 12px;padding:8px 12px;background:var(--panel2);border-bottom:3px solid var(--line)}
.win .ttl b{font-family:"Press Start 2P";font-size:11px;color:var(--gold);text-shadow:2px 2px 0 #000;letter-spacing:.02em}
.win .ttl span{font-size:14px;color:var(--ink);font-weight:700}
.win .ttl small{margin-left:auto;font-size:12px;color:var(--muted)}
.win.gold{--line:#a8842a;--panel2:#2b2414}
.win.red{--line:#8d2a3a;--panel2:#2b141a}
.win.green{--line:#2f7d4b;--panel2:#142b1c}

/* status */
.status{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:start}
@media (max-width:520px){.status{grid-template-columns:1fr;justify-items:center}}
.heroBox{width:132px;height:172px;background:#0a0d1c;box-shadow:inset 0 0 0 3px var(--line);position:relative;display:grid;place-items:end center;padding-bottom:6px;overflow:hidden}
.heroBox::before{content:"";position:absolute;inset:3px;background:linear-gradient(180deg,#1a2350 0,#0a0d1c 60%,#232b4d 100%)}
.heroBox svg{width:108px;height:144px;position:relative;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.6))}
.heroBox.flex svg{animation:hop .45s steps(2) 2}
@keyframes hop{50%{transform:translateY(-8px)}}
.rank{position:absolute;right:6px;top:6px;font-family:"Press Start 2P";font-size:20px;color:var(--gold);text-shadow:3px 3px 0 #000;z-index:2}
.who{min-width:0;width:100%}
.who .name{font-size:24px;font-weight:900;line-height:1.1;text-shadow:3px 3px 0 #000}
.who .name small{font-family:"Press Start 2P";font-size:10px;color:var(--cyan);margin-left:10px}
.who .title{color:var(--gold);font-size:13px;margin-top:4px}
.bar{height:16px;background:#0a0d1c;box-shadow:inset 0 0 0 3px var(--line);position:relative;margin-top:6px;padding:3px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--c,var(--cyan)) 0 6px,transparent 6px 8px);transition:width .5s steps(8)}
.bar span{position:absolute;right:8px;top:2px;font-family:"Press Start 2P";font-size:8px;color:#fff;text-shadow:1px 1px 0 #000}
.lbl{display:flex;justify-content:space-between;font-family:"Press Start 2P";font-size:8px;color:var(--muted);margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
@media (max-width:400px){.stats{grid-template-columns:1fr}}
.stats div{display:flex;justify-content:space-between;align-items:center;background:#0a0d1c;padding:6px 10px;box-shadow:inset 0 0 0 2px var(--line);font-size:13px}
.stats b{font-family:"Press Start 2P";font-size:12px;color:var(--cyan)}

/* quest */
.q{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qt{font-size:17px;font-weight:900}.qt em{font-style:normal;color:var(--gold)}
.goal{font-size:13px;color:var(--muted)}
.goal input{width:46px;font-family:"Press Start 2P";font-size:11px;text-align:center;background:#0a0d1c;box-shadow:inset 0 0 0 2px var(--line);border:0;color:var(--gold);padding:5px 2px}
.entry{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:14px 0 8px}
.step{width:52px;height:52px;background:var(--panel2);box-shadow:0 0 0 3px var(--line),4px 4px 0 3px #000;font-family:"Press Start 2P";font-size:20px;color:var(--gold);display:grid;place-items:center;justify-self:center}
.step:active{transform:translate(2px,2px);box-shadow:0 0 0 3px var(--line),2px 2px 0 3px #000}
.step.l{justify-self:end}.step.r{justify-self:start}
.repbox{text-align:center}
.repbox .n{font-family:"Press Start 2P";font-size:56px;line-height:1;color:#fff;text-shadow:4px 4px 0 #000,0 0 18px var(--cyan)}
.repbox .l{font-family:"Press Start 2P";font-size:8px;color:var(--muted);margin-top:8px}
.logbtn{display:block;width:100%;padding:14px;background:linear-gradient(180deg,#3557d8,#2338a0);color:#fff;font-family:"Press Start 2P";font-size:13px;box-shadow:0 0 0 3px #7fa4ff,5px 5px 0 3px #000;margin-top:10px;text-shadow:2px 2px 0 #000}
.logbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 3px #7fa4ff,2px 2px 0 3px #000}
.logbtn.done{background:linear-gradient(180deg,#2fb56a,#1f7a48);box-shadow:0 0 0 3px #4be08a,5px 5px 0 3px #000}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;min-height:30px}
.sets span{min-width:36px;height:30px;padding:0 8px;display:grid;place-items:center;background:#0a0d1c;box-shadow:inset 0 0 0 2px var(--cyan);font-family:"Press Start 2P";font-size:11px;color:var(--cyan)}
.sets span.pr{box-shadow:inset 0 0 0 2px var(--gold);color:var(--gold)}
.sets .ghost{box-shadow:none;color:var(--faint);font-size:13px;font-family:inherit}
.undo{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:underline}
.reward{margin-top:10px;font-size:13px;color:var(--muted)}.reward b{color:var(--gold)}

/* map */
.mapwrap{background:#0a0d1c;box-shadow:inset 0 0 0 3px var(--line);padding:8px;overflow-x:auto}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;min-width:320px}
.tile{position:relative;aspect-ratio:1;background:#0a0d1c;overflow:hidden;box-shadow:0 0 0 2px #000}
.tile svg.t{width:100%;height:100%;display:block}
.tile .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);font-size:10.5px;text-align:center;padding:2px 0;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.fog .nm{color:var(--faint)}
.tile.conq{box-shadow:0 0 0 2px var(--green)}
.tile.cur{box-shadow:0 0 0 3px var(--gold);animation:blinkb 1s steps(2) infinite}
@keyframes blinkb{50%{box-shadow:0 0 0 3px var(--red)}}
.tile .flag{position:absolute;left:6%;top:6%;width:26%;height:32%}
.tile .boss{position:absolute;right:4%;top:4%;width:44%;height:44%}
.tile .fogq{position:absolute;inset:0;display:grid;place-items:center;font-family:"Press Start 2P";font-size:16px;color:#2c3560}
.tile .hero{position:absolute;left:8%;bottom:22%;width:28%;height:38%}
.field{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;margin-top:12px;padding:12px;background:var(--panel2);box-shadow:inset 0 0 0 3px var(--line)}
@media (max-width:460px){.field{grid-template-columns:1fr;justify-items:center;text-align:center}}
.portrait{width:120px;height:120px;position:relative;background:#0a0d1c;box-shadow:inset 0 0 0 3px var(--line);display:grid;place-items:center}
.portrait svg{width:96px;height:96px}
.portrait.shadow svg{filter:brightness(.15)}
.portrait.hit svg{animation:shake .4s steps(2)}
@keyframes shake{25%{transform:translate(-6px,3px)}75%{transform:translate(6px,-3px)}}
.portrait .ph{position:absolute;inset:auto 0 6px;font-family:"Press Start 2P";font-size:7px;color:var(--muted);text-align:center}
.tname{font-size:22px;font-weight:900;line-height:1.1;text-shadow:3px 3px 0 #000}
.tname small{font-family:"Press Start 2P";font-size:8px;color:var(--red);display:block;margin-bottom:4px}
.tenemy{font-size:13.5px;color:var(--muted);margin-top:4px}
.minions{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px}
.minions i{width:16px;height:12px;display:block;transition:opacity .2s steps(2),transform .2s steps(2)}
.minions i svg{width:100%;height:100%;display:block}
.minions i.down{opacity:.12;transform:rotate(90deg)}
.bossbar{margin-top:10px}
.gmeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.allies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.ally{display:grid;grid-template-columns:36px 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:6px 8px;background:#0a0d1c;box-shadow:inset 0 0 0 2px var(--line)}
.ally .av{grid-row:1/3;width:36px;height:36px;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--cyan);display:grid;place-items:center;font-size:18px}
.ally b{font-size:13px;line-height:1.2}.ally small{font-size:11.5px;color:var(--muted)}
.ally.next{opacity:.5}.ally.none{display:block;grid-column:1/-1;color:var(--muted);font-size:13px}
.ttip{margin-top:12px;font-size:13px;color:var(--muted);padding-top:8px;border-top:3px dotted var(--line)}
.subh{font-family:"Press Start 2P";font-size:8px;color:var(--cyan);margin:14px 0 8px;border-bottom:3px solid var(--line);padding-bottom:6px}

/* growth */
canvas.growth{width:100%;height:150px;display:block;background:#0a0d1c;box-shadow:inset 0 0 0 3px var(--line)}
.delta{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.delta b{display:block;font-family:"Press Start 2P";font-size:14px;color:var(--ink);margin-bottom:4px}
.delta .up{color:var(--green)}.delta .dn{color:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .h{font-family:"Press Start 2P";font-size:7px;text-align:center;color:var(--faint)}
.cal .c{aspect-ratio:1;background:#0a0d1c;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;font-family:"Press Start 2P";font-size:8px;color:var(--faint)}
.cal .c.on{background:#2338a0;color:#fff;box-shadow:inset 0 0 0 2px var(--cyan)}
.cal .c.today{box-shadow:inset 0 0 0 2px var(--gold)}
.cal .c.future{opacity:.3}
.miles{display:grid;gap:4px}
.mi{display:flex;align-items:center;gap:10px;padding:7px 10px;background:#0a0d1c;box-shadow:inset 0 0 0 2px var(--line);font-size:13px}
.mi .box{width:16px;height:16px;box-shadow:inset 0 0 0 2px var(--cyan);flex:none;display:grid;place-items:center;font-size:11px;color:var(--cyan)}
.mi.on{color:var(--muted)}.mi.on .t{text-decoration:line-through}
.mi .d{margin-left:auto;font-family:"Press Start 2P";font-size:7px;color:var(--faint)}
.mi.next .t{font-weight:900;color:var(--gold)}
.vow{box-shadow:inset 0 0 0 3px var(--gold);padding:12px 14px;background:#1c1a10}
.vow .vh{text-align:center;font-family:"Press Start 2P";font-size:10px;color:var(--gold);margin-bottom:8px}
.vow .vl{font-size:15px;line-height:2.1}
.vow input{font:inherit;color:var(--gold);background:#0a0d1c;border:0;box-shadow:inset 0 -3px 0 var(--gold);padding:2px 6px;text-align:center}
.vow input[type=text]{width:88px}.vow input[type=number]{width:52px}.vow input[type=date]{width:150px;font-size:14px}
.vow .vw{display:flex;gap:8px;align-items:baseline;font-size:14px;margin-top:2px}.vow .vw input{flex:1;text-align:left;width:auto;min-width:0}
.vow .vp{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.7}.vow .vp b{color:var(--ink)}
.mot{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}
@media (max-width:640px){.mot{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:"Press Start 2P";font-size:7px;color:var(--muted);border-bottom:3px solid var(--line);padding:6px;font-weight:400}
td{padding:6px;border-bottom:2px dotted var(--line)}
td.r{text-align:right;font-family:"Press Start 2P";font-size:10px;color:var(--cyan)}
.histwrap{max-height:220px;overflow:auto}
.empty{color:var(--faint);font-size:13px;padding:12px;text-align:center}
.whygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.w{padding:12px 14px;background:#0a0d1c;box-shadow:inset 0 0 0 2px var(--line)}
.w .rn{font-family:"Press Start 2P";font-size:8px;color:var(--cyan)}
.w b{display:block;font-size:15.5px;margin:6px 0 4px;font-weight:900}
.w p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.7}
.caution{margin-top:10px;padding:12px 14px;box-shadow:inset 0 0 0 3px var(--red);font-size:13.5px;line-height:1.7;background:#1f0f13}
.caution b{color:var(--red)}
.sysbar{display:flex;gap:10px;align-items:center;background:#000;padding:10px 12px;margin-bottom:14px;box-shadow:0 0 0 3px var(--line),0 0 0 6px var(--bg),0 0 0 9px #2a3566;font-size:14px;min-height:44px}
.sysbar .tag{font-family:"Press Start 2P";font-size:8px;color:var(--gold);white-space:nowrap}
.cursor::after{content:"█";animation:blink 1s steps(1) infinite;color:var(--cyan);margin-left:2px}
@keyframes blink{50%{opacity:0}}

/* overlay */
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.8);opacity:0;pointer-events:none;transition:opacity .2s steps(3)}
.ov.on{opacity:1;pointer-events:auto}
.ov .box{background:var(--panel);box-shadow:0 0 0 4px var(--gold),0 0 0 8px #000,0 0 0 11px var(--line);padding:26px 24px;width:min(88vw,420px);text-align:center;animation:pop .35s steps(4)}
@keyframes pop{from{transform:scale(.6)}}
.ov .eye{font-family:"Press Start 2P";font-size:9px;color:var(--cyan)}
.ov h3{font-size:30px;font-weight:900;margin:8px 0;line-height:1.1;color:#fff;text-shadow:4px 4px 0 #000}
.ov p{color:var(--muted);font-size:14px;margin:6px 0;line-height:1.7;white-space:pre-line}
.ov .port{width:120px;height:120px;margin:6px auto;background:#0a0d1c;box-shadow:inset 0 0 0 3px var(--line);display:grid;place-items:center}.ov .port svg{width:96px;height:96px}
.ov .logbtn{margin-top:14px;font-size:11px;padding:12px}
.confetti{position:fixed;top:-10px;width:8px;height:8px;z-index:61;pointer-events:none;animation:fall 1.8s steps(18) forwards}
@keyframes fall{to{transform:translateY(105vh);opacity:0}}
.dmg{position:fixed;z-index:62;font-family:"Press Start 2P";font-size:22px;color:var(--red);pointer-events:none;animation:rise 1s steps(8) forwards;text-shadow:3px 3px 0 #000}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}25%{opacity:1;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-60px)}}
.sync{font-family:"Press Start 2P";font-size:7px;color:var(--faint);text-align:center;margin-top:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.exsw{display:flex;gap:10px;align-items:center;margin:0 0 14px}
.exsw button{flex:1;background:#141a33;color:var(--muted);border:0;box-shadow:0 0 0 3px var(--line),4px 4px 0 3px #000;padding:10px 8px;font-family:"Galmuri11","Noto Sans KR",sans-serif;font-weight:900;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.exsw button .p8{font-family:"Press Start 2P",monospace;font-size:7px;color:var(--faint)}
.exsw button.on{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 0 0 3px #fff,4px 4px 0 3px #000}
.exsw button.on .p8{color:#fff}
.exsw button[data-ex=ring].on{background:linear-gradient(180deg,#e63946,#8f1d2c)}
.exsw small{display:none}
.cal .c.ring{background:#b8384e !important}
.cal .c.both{background:linear-gradient(135deg,var(--accent) 50%,#b8384e 50%) !important}
</style>

<div class="wrap">
  <div class="sysbar"><span class="tag">SYSTEM</span><span class="cursor" id="sysMsg"></span></div>
  <div class="exsw"><button data-ex="pull"><span class="p8">PULL-UP</span>턱걸이</button><button data-ex="ring"><span class="p8">RING DIPS</span>링딥스</button><small id="exNote"></small></div>

  <div class="win">
    <div class="ttl"><b>STATUS</b><span>상태창</span><small id="stMeta"></small></div>
    <div class="status">
      <div class="heroBox" id="hero"></div>
      <div class="who">
        <div class="name"><span id="heroName">이름 없는 수련자</span><small id="heroLv">LV.1</small></div>
        <div class="title" id="heroTitle"></div>
        <div class="lbl"><span>EXP</span><span id="expTxt"></span></div>
        <div class="bar"><i id="expFill"></i></div>
        <div class="stats">
          <div><span id="lblTotal">근력 · 누적</span><b id="sTotal">0</b></div>
          <div><span id="lblPR">폭발력 · 세트 최고</span><b id="sPR">0</b></div>
          <div><span>의지 · 연속 주</span><b id="sStreak">0</b></div>
          <div><span>지배력 · 영토 (합계)</span><b id="sTerr">0</b></div>
        </div>
      </div>
    </div>
  </div>

  <div class="win gold quest">
    <div class="ttl"><b>QUEST</b><span>일일 퀘스트</span><small id="todayLbl"></small></div>
    <div class="q"><div class="qt"><span id="qName">턱걸이</span> <em id="qTarget"></em>회 × <em id="qSets"></em>세트</div><div class="goal">목표 <input type="number" id="optTarget" min="1" max="60"> × <input type="number" id="optSets" min="1" max="10"></div></div>
    <div class="bar" style="--c:var(--gold)"><i id="goalFill"></i></div>
    <div class="entry">
      <button class="step l" id="dec">-</button>
      <div class="repbox"><div class="n" id="reps">8</div><div class="l">REPS</div></div>
      <button class="step r" id="inc">+</button>
    </div>
    <button class="logbtn" id="logBtn">SET COMPLETE!</button>
    <div class="sets" id="today"></div>
    <div class="reward" id="reward"></div>
  </div>

  <div class="win red war">
    <div class="ttl"><b>WORLD MAP</b><span>던전 · 영토</span><small id="warLbl"></small></div>
    <div class="mapwrap"><div class="map" id="warMap"></div></div>
    <div class="field">
      <div class="portrait" id="portrait"></div>
      <div style="min-width:0;width:100%">
        <div class="tname" id="terrName"></div>
        <div class="tenemy" id="terrEnemy"></div>
        <div class="minions" id="minions"></div>
        <div class="bossbar bar" id="bossBar" hidden style="--c:var(--red)"><i id="bossFill"></i><span id="bossTxt"></span></div>
        <div class="gmeta"><span id="warHint"></span><span id="warRein"></span></div>
      </div>
    </div>
    <div class="subh">PARTY · 부대 편제</div>
    <div class="allies" id="allies"></div>
    <div class="ttip" id="terrTip"></div>

const EXK=['pull','ring'];
const ALLIES=[{lv:2,n:"견습병",r:"보병",p:2,e:"🪖"},{lv:4,n:"창병 소대",r:"보병",p:3,e:"🔱"},{lv:6,n:"궁수대",r:"원거리",p:4,e:"🏹"},{lv:9,n:"기마대",r:"돌격",p:5,e:"🐎"},{lv:12,n:"공병대",r:"공성",p:6,e:"⚒️"},{lv:16,n:"철갑대",r:"중장보병",p:8,e:"🛡️"},{lv:20,n:"근위대",r:"정예",p:10,e:"⚔️"},{lv:25,n:"노장군",r:"총사령",p:12,e:"🎖️"}];
const LVL=40;

const levelOf = total => 1 + Math.floor(total/LVL);
const alliesAt = lv => ALLIES.filter(a => lv >= a.lv);

const nextAlly = lv => ALLIES.find(a => a.lv > lv);
const rankOf = (X,pr) => { let r=X.RANKS[0]; X.RANKS.forEach(x=>{ if(pr>=x[0]) r=x; }); return r; };
const TITLES=[[1,'이름 없는 수련자'],[3,'견습생'],[6,'끈기의 수련자'],[10,'철의 손'],[15,'봉과 링의 기사'],[20,'등 넓은 사람'],[30,'각성한 자'],[45,'철과 고리의 주인']];

// ---------- state ----------
const KEY='ironring-v1';
function freshEx(k){ const X=EXD[k]; return {total:0,pr:0,sessions:[],target:X.target,sets:X.sets,lastSession:'',bumpedDay:'',vow:{},miles:{},war:null}; }
function fromOld(o,k){ const e=freshEx(k); if(!o) return e; ['total','pr','sessions','target','sets','lastSession','bumpedDay','vow','miles'].forEach(f=>{ if(o[f]!==undefined&&o[f]!==null) e[f]=o[f]; }); e.sessions=e.sessions||[]; e.vow=e.vow||{}; e.miles=e.miles||{}; if(k==='pull'&&e.sets===4) e.sets=5; if(k==='ring'&&e.sets===4) e.sets=5; e.war=o.war&&o.war.conq?o.war:null; return e; }
let S={cur:'pull', ex:{}, started:'', updatedAt:0};
let migrated=false;
(function load(){ let raw=null; try{ raw=localStorage.getItem(KEY); }catch(e){} if(raw){ try{ S=Object.assign(S,JSON.parse(raw)); }catch(e){} }
  else { let op=null, orr=null; try{ op=JSON.parse(localStorage.getItem('pullup-ledger-v1')||'null'); orr=JSON.parse(localStorage.getItem('ring-pilgrim-v1')||'null'); }catch(e){} if(!orr&&window.__RING_SEED__) orr=window.__RING_SEED__; S.ex.pull=fromOld(op,'pull'); S.ex.ring=fromOld(orr,'ring'); if(op&&op.started) S.started=op.started; migrated=!!(op||orr); }
  EXK.forEach(k=>{ if(!S.ex[k]) S.ex[k]=freshEx(k); }); if(!S.started) S.started=todayKey(); if(!EXD[S.cur]) S.cur='pull'; })();

let db=null, docRef=null, wT=null, applying=false;
function persist(){ S.updatedAt=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} if(docRef&&!applying){ clearTimeout(wT); wT=setTimeout(async()=>{ try{ await docRef.set(JSON.parse(JSON.stringify(S))); $('syncMsg').textContent='CLOUD SYNC OK'; }catch(e){ $('syncMsg').textContent='LOCAL SAVE (SYNC FAIL)'; } },600);} }
function adopt(r){ if(!r.ex){ const n={cur:'pull',ex:{pull:fromOld(r,'pull'),ring:S.ex.ring||fromOld(window.__RING_SEED__||null,'ring')},started:r.started||S.started,updatedAt:r.updatedAt||0}; r=n; } S=Object.assign(S,r); EXK.forEach(k=>{ if(!S.ex[k]) S.ex[k]=freshEx(k); if(!S.ex[k].war) rebuildWar(S.ex[k]); }); }
(async()=>{ try{ db=await (window.claude?.use?.('db')??Promise.resolve(null)); if(!db) return; docRef=db.doc('state/main'); const s=await docRef.get(); if(s.exists){ const r=s.data(); if((r.updatedAt||0)>(S.updatedAt||0)||!r.ex){ applying=true; adopt(r); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} render(); applying=false; if(!r.ex) persist(); } else if((S.updatedAt||0)>(r.updatedAt||0)) persist(); } else persist(); $('syncMsg').textContent='CLOUD SYNC OK'; docRef.onSnapshot(sn=>{ if(!sn.exists||sn.metadata.hasPendingWrites) return; const r=sn.data(); if(r.ex&&(r.updatedAt||0)>(S.updatedAt||0)){ applying=true; adopt(r); render(); applying=false; } },()=>{}); }catch(e){} })();

// ---------- war ----------
function freshWar(){ return {t:0,m:0,b:0,conq:[]}; }
function applyDamage(w,d){ const ev=[]; while(d>0){ const T=w.t, mm=T_MIN(T), bh=T_BOSS(T); if(w.m<mm){ const k=Math.min(d,mm-w.m); w.m+=k; d-=k; if(w.m>=mm) ev.push({type:'boss',T}); } else { const k=Math.min(d,bh-w.b); w.b+=k; d-=k; if(w.b>=bh){ ev.push({type:'conquer',T}); w.conq.push(T); w.t++; w.m=0; w.b=0; } } } return ev; }
function rebuildWar(e){ const w=freshWar(); const chron=[...e.sessions].reverse(); const sum=chron.reduce((a,s)=>a+s.total,0); let run=0; const pre=Math.max(0,e.total-sum); if(pre>0){ applyDamage(w,pre); run=pre; } chron.forEach(s=>s.sets.forEach(r=>{ applyDamage(w, r+powerAt(levelOf(run))); run+=r; })); e.war=w; }
EXK.forEach(k=>{ if(!S.ex[k].war) rebuildWar(S.ex[k]); });
if(migrated) persist();
const reinforced={};
EXK.forEach(k=>{ const e=S.ex[k]; reinforced[k]=0; if(!e.lastSession) return; const days=Math.floor((Date.now()-new Date(e.lastSession).getTime())/86400000); if(days>=7&&(e.war.m>0||e.war.b>0)){ const w=e.war; let r=0; if(w.b>0){ r=Math.round(T_BOSS(w.t)*0.1); w.b=Math.max(0,w.b-r); } else { r=Math.round(T_MIN(w.t)*0.1); w.m=Math.max(0,w.m-r); } reinforced[k]=r; e.lastSession=todayKey(); persist(); } });

// ---------- logging ----------
let reps=E().target;
function todayRec(e){ const k=todayKey(); let r=e.sessions.find(s=>s.d===k); if(!r){ r={d:k,sets:[],total:0}; e.sessions.unshift(r); } return r; }
function todaySets(e){ const r=e.sessions.find(s=>s.d===todayKey()); return r?r.sets:[]; }
function streak(e){ const weeks=new Set(e.sessions.map(x=>weekKey(x.d))); let st=0,d=new Date(); if(!weeks.has(weekKey(d))) d.setDate(d.getDate()-7); while(weeks.has(weekKey(d))&&st<500){st++; d.setDate(d.getDate()-7);} return st; }
function checkMiles(e,Xd){ e.miles=e.miles||{}; const fresh=[]; Xd.MILES.forEach(m=>{ if(!e.miles[m.k]&&m.f(e)){ e.miles[m.k]=todayKey(); fresh.push(m); } }); return fresh; }
function logSet(){
  const e=E(), Xd=X(), r=Math.max(1,reps), rec=todayRec(e);
  const lvBefore=levelOf(heroTotal()), rankBefore=rankOf(Xd,e.pr)[1];
  rec.sets.push(r); rec.total+=r; e.total+=r; e.lastSession=todayKey(); e.sessions=e.sessions.slice(0,200);
  const isPR=r>e.pr; if(isPR) e.pr=r;
  const dmg=r+powerAt(lvBefore); const ev=applyDamage(e.war,dmg); warHit(dmg);
  const lvAfter=levelOf(heroTotal()), newAlly=alliesAt(lvAfter).length>alliesAt(lvBefore).length, rankAfter=rankOf(Xd,e.pr)[1];
  let questDone=false; if(rec.sets.length>=e.sets && rec.sets.every(x=>x>=e.target) && e.bumpedDay!==rec.d){ e.target+=1; e.bumpedDay=rec.d; questDone=true; }
  const fresh=checkMiles(e,Xd);
  const vowHit = e.vow&&e.vow.reps&&r>=e.vow.reps&&!e.vow.done; if(vowHit) e.vow.done=todayKey();
  persist();
  $('hero').classList.remove('flex'); void $('hero').offsetWidth; $('hero').classList.add('flex');
  const conq=ev.find(x=>x.type==='conquer'), bossUp=ev.find(x=>x.type==='boss');
  const queue=[];
  if (rankAfter!==rankBefore) queue.push(['RANK UP', Xd.n+' '+rankAfter+' 등급', '한 세트 '+e.pr+'회. 「'+rankOf(Xd,e.pr)[2]+'」\n등급은 한 세트 최고 기록으로 정해진다.', heroPixel(lvAfter)]);
  if (vowHit) queue.push(['VOW FULFILLED', e.vow.reps+'회 달성', (e.vow.name||'')+' — 적어 둔 대로 해냈다.\n'+(e.vow.why||'')+'\n새 서약을 적을 시간이다.', null]);
  if (lvAfter>lvBefore) queue.push(['LEVEL UP', 'LV.'+lvAfter, '칭호 · '+titleOf(lvAfter)+'\n턱걸이+링딥스 누적 '+heroTotal()+'회. 어제의 너보다 강하다.', heroPixel(lvAfter)]);
  if (newAlly){ const a=alliesAt(lvAfter).slice(-1)[0]; queue.push(['NEW ALLY', a.e+' '+a.n, a.r+' · 화력 +'+a.p+'\n이제 두 전선 모두에서 한 세트마다 '+powerAt(lvAfter)+'만큼 더 벤다.', null]); }
  if (conq) queue.push(['TERRITORY CLEAR', terrOf(Xd,conq.T).n, '「'+terrOf(Xd,conq.T).b+'」을(를) 베고 땅을 얻었다.\n다음 던전: '+terrOf(Xd,conq.T+1).n, bossPixel(conq.T+(S.cur==='ring'?100:0),{hurt:true})]);
  else if (bossUp) queue.push(['BOSS APPEARS', terrOf(Xd,bossUp.T).b, '졸병을 모두 밀어냈다. 이 땅의 군주가 직접 나섰다.\nHP '+T_BOSS(bossUp.T), bossPixel(bossUp.T+(S.cur==='ring'?100:0))]);
  if (isPR && !queue.length) queue.push(['NEW RECORD', Xd.n+' '+r+'회', '지난 최고를 넘었다. 이 숫자가 내일의 첫 세트다.', null]);
  if (fresh.length && !queue.length) queue.push(['ACHIEVEMENT', fresh[0].t, '기록에 날짜가 찍혔다.', null]);
  if (questDone && !queue.length) queue.push(['QUEST CLEAR', '내일은 '+e.target+'회', '전 세트를 채웠다. 목표가 한 개 올랐다.', null]);
  if (queue.length){ if(queue.some(q=>['RANK UP','LEVEL UP','TERRITORY CLEAR'].includes(q[0]))) confetti(); runQueue(queue); }
  else { const m=Xd.SAY[Math.floor(Math.random()*Xd.SAY.length)]; sys(m.replace('{d}',dmg).replace('{t}',rec.total).replace('{r}',r)); }
  render();
}
let ovQueue=[];
function runQueue(q){ ovQueue=q.slice(); nextOv(); }
function nextOv(){ const q=ovQueue.shift(); if(!q){ $('ov').classList.remove('on'); return; } overlay(...q); }
function overlay(e,t,b,port){ $('ovEye').textContent=e; $('ovTitle').textContent=t; $('ovBody').textContent=b; $('ovPort').innerHTML=port||''; $('ovPort').hidden=!port; $('ov').classList.add('on'); sys('['+e+'] '+t); }
$('ovOk').onclick=()=>{ $('ov').classList.remove('on'); setTimeout(nextOv,150); };
function undo(){ const e=E(); const rec=e.sessions.find(s=>s.d===todayKey()); if(!rec||!rec.sets.length) return; const r=rec.sets.pop(); rec.total-=r; e.total=Math.max(0,e.total-r); if(!rec.sets.length) e.sessions=e.sessions.filter(s=>s!==rec); e.pr=Math.max(0,...e.sessions.flatMap(s=>s.sets)); rebuildWar(e); persist(); sys('마지막 세트 취소. 전황을 되감았다.'); render(); }
function warHit(r){ const el=$('portrait'); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); const rect=el.getBoundingClientRect(); const d=document.createElement('div'); d.className='dmg'; d.textContent='-'+r; d.style.left=(rect.left+rect.width/2-18)+'px'; d.style.top=rect.top+'px'; document.body.appendChild(d); setTimeout(()=>d.remove(),1100); }
function confetti(){ const cols=['#5fe3ff','#ffd23f','#ff4b5c','#4be08a','#b07cff']; for(let i=0;i<80;i++){ const c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%cols.length]; c.style.animationDelay=(Math.random()*.6)+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),2600);} }

// ---------- render ----------
function render(){
  const e=E(), Xd=X(), lv=levelOf(heroTotal()), rk=rankOf(Xd,e.pr), t=todaySets(e), sum=t.reduce((a,b)=>a+b,0);
  document.querySelectorAll('.exsw button').forEach(b=>b.classList.toggle('on',b.dataset.ex===S.cur));
  const other=S.cur==='pull'?'ring':'pull'; const ot=todaySets(S.ex[other]).length; $('exNote').textContent=ot?EXD[other].n+' 오늘 '+ot+'세트 완료':EXD[other].n+' 오늘 미수행';
  $('reps').textContent=reps;
  $('hero').innerHTML=heroPixel(lv)+'<span class="rank">'+rk[1]+'</span>';
  const nm=(S.ex.pull.vow&&S.ex.pull.vow.name)||(S.ex.ring.vow&&S.ex.ring.vow.name)||'이름 없는 수련자';
  $('heroName').textContent=nm; $('heroLv').textContent='LV.'+lv; $('heroTitle').textContent='「'+titleOf(lv)+'」 · '+Xd.n+' '+rk[1]+'급 '+rk[2];
  const inLv=heroTotal()-(lv-1)*LVL; $('expTxt').textContent=inLv+'/'+LVL+' (턱걸이 '+S.ex.pull.total+' + 링 '+S.ex.ring.total+')'; $('expFill').style.width=(inLv/LVL*100)+'%';
  $('stMeta').textContent='NO.'+S.started.replace(/-/g,'');
  $('lblTotal').textContent=Xd.n+' · 누적'; $('lblPR').textContent=Xd.n+' · 세트 최고';
  $('sTotal').textContent=e.total; $('sPR').textContent=e.pr; $('sStreak').textContent=streak(e); $('sTerr').textContent=S.ex.pull.war.conq.length+S.ex.ring.war.conq.length;
  $('qName').textContent=Xd.n; $('qTarget').textContent=e.target; $('qSets').textContent=e.sets; $('optTarget').value=e.target; $('optSets').value=e.sets;
  $('todayLbl').textContent=t.length?t.length+'세트 · '+sum+'회':'미수행';
  const goal=e.target*e.sets; $('goalFill').style.width=Math.min(100,sum/goal*100)+'%';
  $('today').innerHTML=(t.length?t.map(x=>`<span class="${x>=e.pr&&x>0?'pr':''}">${x}</span>`).join(''):'<span class="ghost">첫 세트를 기록하면 여기에 찍힌다</span>')+(t.length?'<button class="undo" id="undoBtn">취소</button>':'');
  if(t.length) $('undoBtn').onclick=undo;
  $('logBtn').className='logbtn '+(t.length>=e.sets?'done':''); $('logBtn').textContent=t.length>=e.sets?'BONUS SET!':'SET COMPLETE!';
  $('reward').innerHTML='세트당 EXP <b>+반복수</b> · 적 격퇴 <b>+반복수+화력 '+powerAt(lv)+'</b> · '+e.sets+'세트 전부 목표 달성 시 내일 목표 +1';
  $('whyTtl').textContent=Xd.n+'을 하는 까닭'; $('howTtl').textContent=Xd.n+' 하는 법';
  $('whygrid').innerHTML=Xd.WHY.map((w,i)=>`<div class="w"><div class="rn">${String(i+1).padStart(2,'0')}</div><b>${w[0]}</b><p>${w[1]}</p></div>`).join(''); $('caution').innerHTML=Xd.CAUTION;
  $('howgrid').innerHTML=Xd.HOW.map((w,i)=>`<div class="w"><div class="rn">STEP ${i+1}</div><b>${w[0]}</b><p>${w[1]}</p></div>`).join('');
  renderWar(); renderGrowth(); renderMot(); renderHist();
}
function flagSVG(){ return px(["k.......","kwwwww..","kwrrrww.","kwrrrww.","kwwwww..","k.......","k.......","k......."],{k:'#3b2a20',w:'#ffffff',r:'#ff4b5c'}); }
function renderWar(){
  const e=E(), Xd=X(), w=e.war, lv=levelOf(heroTotal()), al=alliesAt(lv), pw=powerAt(lv), nx=nextAlly(lv), off=S.cur==='ring'?100:0;
  const cur=terrOf(Xd,w.t), mm=T_MIN(w.t), bh=T_BOSS(w.t), bossPhase=w.m>=mm;
  $('warLbl').textContent=Xd.en+' · TERRITORY '+w.conq.length+'/'+Xd.TERR.length;
  const total=Math.max(Xd.TERR.length,w.t+1); let html='';
  for(let i=0;i<total;i++){ const st=i<w.t?'conq':i===w.t?'cur':'fog'; const tt=terrOf(Xd,i);
    const tile=tilePixel(tt.tile, st==='fog'?'fog':'conq').replace('<svg','<svg class="t"');
    let ov='';
    if(st==='conq') ov='<div class="flag">'+flagSVG()+'</div>';
    if(st==='cur'){ ov='<div class="hero">'+heroPixel(lv)+'</div><div class="boss">'+bossPixel(i+off,{hurt:false})+'</div>'; }
    if(st==='fog'&&i>w.t+1) ov='<div class="fogq">?</div>';
    html+=`<div class="tile ${st}">${tile}${ov}<div class="nm">${st==='fog'&&i>w.t+1?'???':tt.n}</div></div>`; }
  $('warMap').innerHTML=html;
  $('portrait').className='portrait '+(bossPhase?'':'shadow'); $('portrait').innerHTML=bossPixel(w.t+off)+(bossPhase?'':'<span class="ph">BOSS WAITING</span>');
  $('terrName').innerHTML='<small>'+(bossPhase?'BOSS':'DUNGEON '+(w.t+1))+'</small>'+(bossPhase?cur.b:cur.n);
  $('terrEnemy').textContent=bossPhase?cur.n+'의 군주가 나섰다. HP '+(bh-w.b):'「'+cur.m+'」 '+(mm-w.m)+'명이 남았다';
  if(bossPhase){ $('minions').hidden=true; $('bossBar').hidden=false; $('bossFill').style.width=((bh-w.b)/bh*100)+'%'; $('bossTxt').textContent=(bh-w.b)+'/'+bh; }
  else { $('minions').hidden=false; $('bossBar').hidden=true; let h=''; const ms=minionPixel(w.t+off); for(let i=0;i<mm;i++) h+=`<i class="${i<w.m?'down':''}">${ms}</i>`; $('minions').innerHTML=h; }
  const perSet=e.target+pw, left=bossPhase?(bh-w.b):(mm-w.m)+bh;
  $('warHint').textContent='한 세트 = 반복수 + 화력 '+pw+' · 이 땅까지 약 '+Math.ceil(left/Math.max(1,perSet))+'세트';
  $('warRein').textContent=reinforced[S.cur]?'7일 방치 · 적 '+reinforced[S.cur]+' 증원됨':'7일 쉬면 적이 10% 증원된다';
  $('allies').innerHTML=(al.length?al.map(a=>`<div class="ally"><span class="av">${a.e}</span><b>${a.n}</b><small>${a.r} · 화력 ${a.p}</small></div>`).join(''):'<div class="ally none">아직 혼자다. LV.'+ALLIES[0].lv+'에 첫 부대가 온다.</div>')+(nx?`<div class="ally next"><span class="av">?</span><b>${nx.n}</b><small>LV.${nx.lv} 합류 · ${(nx.lv-1)*LVL-heroTotal()}회 남음</small></div>`:'');
  $('terrTip').textContent=(cur.s?cur.s+'  ':'')+'지침 · '+cur.tip;
}
function renderGrowth(){
  const e=E(); const c=$('growth'), ctx=c.getContext('2d'), W=c.width, H=c.height; ctx.clearRect(0,0,W,H);
  const weeks=[]; const now=new Date(); for(let i=7;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i*7); const k=weekKey(d); const ss=e.sessions.filter(s=>weekKey(s.d)===k); weeks.push({k, tot:ss.reduce((a,s)=>a+s.total,0), pr:Math.max(0,...ss.flatMap(s=>s.sets))}); }
  const maxT=Math.max(10,...weeks.map(w=>w.tot)), maxP=Math.max(5,...weeks.map(w=>w.pr)); const pad=28, bw=(W-pad*2)/8;
  ctx.fillStyle='#1c2447'; [0.25,0.5,0.75].forEach(f=>{ ctx.fillRect(pad,Math.round(H-20-(H-40)*f),W-pad*2,2); });
  weeks.forEach((w,i)=>{ const x=Math.round(pad+i*bw+bw*0.2), h=Math.round((H-40)*w.tot/maxT/6)*6; ctx.fillStyle=S.cur==='ring'?'#b8384e':'#3557d8'; ctx.fillRect(x,H-20-h,Math.round(bw*0.6),h); ctx.fillStyle=S.cur==='ring'?'#ff9fb0':'#5fe3ff'; for(let yy=H-20-h;yy<H-20;yy+=6) ctx.fillRect(x,yy,Math.round(bw*0.6),2); ctx.fillStyle='#a9b3d6'; ctx.font='9px "Press Start 2P"'; ctx.textAlign='center'; ctx.fillText(w.tot||'', x+bw*0.3, H-24-h); ctx.fillText(w.k.slice(5), x+bw*0.3, H-6); });
  weeks.forEach((w,i)=>{ if(!w.pr) return; const x=Math.round(pad+i*bw+bw*0.5), y=Math.round(H-20-(H-40)*w.pr/maxP); ctx.fillStyle='#ffd23f'; ctx.fillRect(x-4,y-4,8,8); if(i&&weeks[i-1].pr){ const px0=Math.round(pad+(i-1)*bw+bw*0.5), py0=Math.round(H-20-(H-40)*weeks[i-1].pr/maxP); const steps=8; for(let s=0;s<=steps;s++){ ctx.fillRect(Math.round(px0+(x-px0)*s/steps)-1, Math.round(py0+(y-py0)*s/steps)-1, 3,3); } } });
  ctx.fillStyle='#a9b3d6'; ctx.textAlign='left'; ctx.font='8px "Press Start 2P"'; ctx.fillText(X().en+' WEEKLY', pad, 12); ctx.fillStyle='#ffd23f'; ctx.fillText('SET MAX', pad+150, 12);
  const cur=weeks[7], prev=weeks[6], d1=cur.tot-prev.tot, d2=cur.pr-prev.pr;
  const firstK=e.sessions.length?e.sessions[e.sessions.length-1].d:todayKey(); const days=Math.max(1,Math.round((new Date(todayKey())-new Date(firstK))/86400000)+1);
  $('delta').innerHTML=`<div><b>${cur.tot}</b>이번 주 총 반복 <span class="${d1>=0?'up':'dn'}">${d1>=0?'+':''}${d1}</span></div><div><b>${cur.pr}</b>이번 주 세트 최고 <span class="${d2>=0?'up':'dn'}">${d2>=0?'+':''}${d2}</span></div><div><b>${days}D</b>수련 시작 후 · ${e.sessions.length}일 출석</div>`;
}
function renderMot(){
  const e=E(), Xd=X(); e.vow=e.vow||{}; const v=e.vow;
  ['vowName','vowDate','vowReps','vowWhy'].forEach(id=>{ const el=$(id); if(document.activeElement!==el) el.value=v[id.slice(3).toLowerCase()]??''; });
  $('vowEx').textContent=Xd.n;
  const P=$('vowProg');
  if(v.reps){ const need=Math.max(0,v.reps-e.pr), pct=Math.min(100,e.pr/v.reps*100); let days=null; if(v.date) days=Math.ceil((new Date(v.date+'T00:00:00')-new Date(todayKey()+'T00:00:00'))/86400000);
    let line='현재 최고 <b>'+e.pr+'회</b> → 목표 <b>'+v.reps+'회</b>'+(need?' · 앞으로 <b>'+need+'개</b>':' · <b>달성!</b>'); if(days!==null) line+= days>=0?' · <b>D-'+days+'</b>'+(need&&days>0?' (주당 약 '+(need/Math.max(1,days/7)).toFixed(1)+'개씩)':''):' · 기한 지남 — 다시 정하자';
    P.innerHTML=line+'<div class="bar" style="--c:var(--gold);margin-top:8px"><i style="width:'+pct+'%"></i></div>'; }
  else P.innerHTML='목표 횟수와 기한을 적으면 남은 거리와 속도를 계산해 준다.';
  e.miles=e.miles||{}; let nm=false; $('miles').innerHTML=Xd.MILES.map(m=>{ const on=!!e.miles[m.k]; const next=!on&&!nm; if(next) nm=true; return `<div class="mi ${on?'on':''} ${next?'next':''}"><span class="box">${on?'✓':''}</span><span class="t">${m.t}</span><span class="d">${on?e.miles[m.k].slice(2):(next?'NEXT':'')}</span></div>`; }).join('');
  const dp=new Set(S.ex.pull.sessions.map(s=>s.d)), dr=new Set(S.ex.ring.sessions.map(s=>s.d)); const today=new Date(); const start=new Date(today); start.setDate(today.getDate()-((today.getDay()+6)%7)-28);
  let html=['M','T','W','T','F','S','S'].map(d=>'<div class="h">'+d+'</div>').join(''); for(let i=0;i<35;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const k=fmtK(d); const p=dp.has(k), r=dr.has(k); html+=`<div class="c ${p&&r?'on both':p?'on':r?'on ring':''} ${k===todayKey()?'today':''} ${d>today?'future':''}">${d.getDate()}</div>`; } $('cal').innerHTML=html;
}
['vowName','vowDate','vowReps','vowWhy'].forEach(id=>$(id).addEventListener('change',ev=>{ const e=E(); e.vow=e.vow||{}; const k=id.slice(3).toLowerCase(); e.vow[k]= id==='vowReps'?(parseInt(ev.target.value)||''):ev.target.value.trim(); if(id==='vowReps'||id==='vowDate') e.vow.done=''; persist(); render(); }));
function renderHist(){ const e=E(); $('hist').innerHTML=e.sessions.length?e.sessions.slice(0,40).map(s=>`<tr><td class="p8" style="font-size:9px">${s.d.slice(5)}</td><td style="color:var(--muted)">${s.sets.join(' · ')}</td><td class="r">${s.total}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">첫 기록을 기다리는 중.</td></tr>'; }

// ---------- controls ----------
document.querySelectorAll('.exsw button').forEach(b=>b.onclick=()=>{ if(S.cur===b.dataset.ex) return; S.cur=b.dataset.ex; reps=E().target; persist(); render(); greet(); });
$('logBtn').onclick=logSet;
$('inc').onclick=()=>{ reps=Math.min(99,reps+1); $('reps').textContent=reps; };
$('dec').onclick=()=>{ reps=Math.max(1,reps-1); $('reps').textContent=reps; };
$('optTarget').addEventListener('change',ev=>{ E().target=Math.max(1,parseInt(ev.target.value)||1); reps=E().target; persist(); render(); });
$('optSets').addEventListener('change',ev=>{ E().sets=Math.max(1,parseInt(ev.target.value)||1); persist(); render(); });
document.addEventListener('keydown',ev=>{ if(ev.target.tagName==='INPUT') return; if($('ov').classList.contains('on')){ if(['Enter','Escape',' '].includes(ev.key)){ ev.preventDefault(); $('ovOk').click(); } return; } if(ev.key==='Enter'){ ev.preventDefault(); logSet(); } else if(ev.key==='ArrowUp'){ ev.preventDefault(); $('inc').click(); } else if(ev.key==='ArrowDown'){ ev.preventDefault(); $('dec').click(); } });
render();
function greet(){ const e=E(), Xd=X(); const t=todaySets(e); const idle=e.lastSession?Math.floor((Date.now()-new Date(e.lastSession).getTime())/86400000):0;
  if(reinforced[S.cur]) sys('경고. '+Xd.n+' 전선 7일 이상 공백. 적이 '+reinforced[S.cur]+' 증원됐다. 오늘 되찾는다.');
  else if(idle>=3&&!t.length) sys(Xd.n+' 복귀 감지. '+idle+'일 만이다. 가볍게 한 세트부터.');
  else if(!t.length) sys(Xd.n+' 일일 퀘스트 대기 중. '+e.sets+'세트. 첫 세트를 기록하라.');
  else if(t.length>=e.sets) sys(Xd.n+' 오늘 퀘스트 완료. 추가 세트는 보너스다.');
  else sys(Xd.n+' 진행 중. '+(e.sets-t.length)+'세트 남았다.');
}
greet();
if(migrated) setTimeout(()=>overlay('DATA MERGED','두 전선 통합','철봉 수련장부와 링의 순례길 기록을 하나로 합쳤다.\n턱걸이 '+S.ex.pull.total+'회 · 링딥스 '+S.ex.ring.total+'회.\n주인공은 한 명, 전선은 둘.', heroPixel(levelOf(heroTotal()))),500);
else { const rk=EXK.find(k=>reinforced[k]); if(rk) setTimeout(()=>overlay('ENEMY REINFORCED','+'+reinforced[rk],EXD[rk].n+' 전선을 일주일 넘게 비운 사이 적이 병력을 보충했다. 오늘 다시 밀어낸다.', bossPixel(S.ex[rk].war.t+(rk==='ring'?100:0))),600); }

})();
